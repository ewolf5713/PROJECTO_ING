name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean test

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Build app image
        shell: bash
        run: |
          mkdir input dist
          cp target/rurex-transporte-1.0-SNAPSHOT.jar input/RUREX.jar
          jpackage --type app-image --name RUREX --input input --main-jar RUREX.jar --main-class com.rurex.Main --app-version 1.0.0 --dest dist
      - name: Zip for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/RUREX -DestinationPath RUREX-windows.zip
      - name: Tar for Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf RUREX-linux.tar.gz -C dist RUREX
          cp input/RUREX.jar RUREX.jar
      - uses: actions/upload-artifact@v7
        with:
          name: rurex-${{ runner.os }}
          path: |
            RUREX-windows.zip
            RUREX-linux.tar.gz
            RUREX.jar
          if-no-files-found: ignore

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" files/* --title "RUREX $TAG" --notes-file INSTALL.md
